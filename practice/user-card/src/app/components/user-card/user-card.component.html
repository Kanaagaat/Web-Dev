<div class="user-card">
  <!-- Display Mode -->
  @if (!isEditing) {
    <div class="card-header">
      <h2 class="user-name">{{ user.name }}</h2>
      <span class="user-badge">{{ user.age }} years old</span>
    </div>

    <div class="card-content">
      <div class="info-row">
        <span class="info-label">Name:</span>
        <span class="info-value">{{ user.name }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Age:</span>
        <span class="info-value">{{ user.age }}</span>
      </div>
    </div>

    <div class="card-actions">
      @if (editable) {
        <button class="btn btn-edit" (click)="toggleEdit()">
          ✏️ Edit
        </button>
      }
      @if (editable) {
        <button class="btn btn-delete" (click)="onDelete()">
          🗑️ Delete
        </button>
      }
    </div>
  }

  <!-- Edit Mode -->
  @if (isEditing && editable) {
    <div class="card-header">
      <h2>Edit User</h2>
    </div>

    <form class="card-form">
      <div class="form-group">
        <label for="nameInput" class="form-label">Name:</label>
        <input
          id="nameInput"
          type="text"
          class="form-input"
          [(ngModel)]="editedName"
          (input)="onNameInput($event)"
          name="name"
          placeholder="Enter user name"
        />
      </div>

      <div class="form-group">
        <label for="ageInput" class="form-label">Age:</label>
        <input
          id="ageInput"
          type="number"
          class="form-input"
          [(ngModel)]="editedAge"
          name="age"
          placeholder="Enter age"
          min="1"
          max="150"
        />
      </div>
    </form>

    <div class="card-actions">
      <button
        class="btn btn-save"
        (click)="updateUser()"
        [disabled]="!isFormValid()"
      >
        💾 Save
      </button>
      <button class="btn btn-cancel" (click)="toggleEdit()">
        ❌ Cancel
      </button>
    </div>
  }
</div>
